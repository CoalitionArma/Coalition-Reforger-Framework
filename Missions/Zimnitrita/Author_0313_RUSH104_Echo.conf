 m_sDescription "MEC forces have been stationed at the Western dam defending it from an onslaught of Russian commandos whom have been tasked to level the dam itself. While the MEC are weary and running out of supplies, the opposing side is said to be amassing the last of their forces in the region. Intel suggests that the Russian forces are unable to communicate over long ranges with the artillery support necessary to cause the breach, thus, MEC forces are to defend the surrounding territory and restrict access to the MCOM radios, otherwise the local ecosystems will collapse.  "
